<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Penilaian SLA MKP</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202132;background:#f3f1f9;font-size:16px;--accent:#6143b5;--line:#dedbe8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,calc((100vw - 1000px)/2));gap:12px}.brand{display:flex;flex-direction:column;gap:5px}.brand .logo{height:38px;width:auto;display:block;align-self:flex-start}.brand-sub{font-size:11px;font-weight:700;color:#6c687c;text-transform:uppercase;letter-spacing:.3em;text-align:justify;text-align-last:justify;line-height:1}.brand span{color:var(--accent)}main{max-width:760px;margin:28px auto;padding:0 15px}footer{text-align:center;color:#777287;font-size:12px;padding:20px}h1{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:0 0 10px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}p{line-height:1.55;margin:8px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px;box-shadow:0 2px 6px #2d1c6210}.hero{border-top:7px solid var(--accent)}.bar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:16px}.muted,small{color:#6c687c;font-size:13px}.required,.error{color:#b3261e}.error{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;font-weight:550;margin-bottom:8px}input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid #d4d0df;border-radius:7px;background:#fff;color:#202132;margin:5px 0 12px}input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #8466e4;outline-offset:2px}textarea{resize:vertical;min-height:80px}button,.btn{border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:white;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:normal}button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.55;cursor:wait}button.danger{color:#a52d25}.choice{display:flex;align-items:center;gap:10px;font-weight:400;margin:12px 0;overflow-wrap:anywhere}input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px;flex:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tag{font-size:12px;background:#efedf5;border-radius:12px;padding:4px 9px;color:#605773}.sig{width:100%;height:190px;background:white;border:1px dashed #aaa4b7;border-radius:8px;touch-action:none;cursor:crosshair;display:block;margin:12px 0}.signature-image{max-width:100%;max-height:190px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}.question-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.answer{border-bottom:1px solid var(--line);padding:8px 0}.answer:last-child{border:0}.answer p{margin:4px 0 8px}.empty{text-align:center;padding:35px 20px}.spacer{height:10px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px;padding-top:6px;border-top:2px solid var(--line)}.page-head h2{margin:0}.step-info{margin:0 0 12px;font-weight:600}.nav{margin:6px 0 24px}.page-title{margin:20px 0 6px;color:var(--accent)}
.divider{border:0;border-top:1px solid var(--line);margin:14px 0}.q-title{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;line-height:1.5}div.q-title{font-size:17px;font-weight:700}.answer strong{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.agree-line{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;line-height:1.45;margin:4px 2px 14px;cursor:pointer}.agree-line input{width:14px;height:14px;margin:2px 0 0;flex:none}
.q-title.rich{font-weight:500}
.rich-block{line-height:1.55;margin:8px 0 14px;overflow-wrap:anywhere}.rich-block .ln,.rich-block li{white-space:pre-wrap;min-height:1.55em}.rich-block ul,.rich-block ol{margin:4px 0;padding-left:26px}.rich-block li{margin:3px 0;padding-left:3px}.q-title.rich-block{margin:0 0 14px}
.field-label{font-weight:550;margin-bottom:6px}.rte{margin:2px 0 14px}.rte-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:8px 0}.img-grid:empty{display:none}.img-thumb{position:relative}.img-thumb img{width:100%;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:8px;display:block}.img-thumb button{position:absolute;top:4px;right:4px;padding:0 7px;border-radius:50%;background:#fff;line-height:1.5;font-size:13px}.answer-imgs{display:flex;flex-wrap:wrap;gap:10px}.answer-imgs img.q-img{max-width:calc(50% - 5px);max-height:320px;margin:6px 0}
img.q-img{max-width:100%;max-height:420px;border:1px solid var(--line);border-radius:8px;display:block;margin:6px 0 14px;object-fit:contain;background:#fff}.img-prev:empty{display:none}.img-field{margin:2px 0 14px}.desc-block{margin:0}
select.copy-to{width:auto;margin:0;padding:8px 10px;font-size:14px;font-weight:600;color:var(--accent)}button.tool{padding:5px 12px;font-size:14px;min-width:40px}
.rte-area{padding:11px 12px;border:1px solid #d4d0df;border-radius:7px;background:#fff;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}.rte-area:focus{outline:2px solid #8466e4;outline-offset:2px}.rte-area:empty::before{content:attr(data-ph);color:#8b8799;pointer-events:none}.rte-area ul,.rte-area ol{margin:4px 0;padding-left:26px}.rte-area div{min-height:1.55em}.rte-count{text-align:right;margin-top:4px}
.color-group{display:inline-flex;align-items:center;gap:2px;padding:0 4px;border:1px solid #d4d0df;border-radius:7px;background:#fff}.rte-tools .color-group button.color-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;min-width:0;height:24px;padding:0;border:0;border-radius:50%;background:transparent}.rte-tools .color-group button.color-btn:hover{background:#efedf5}.color-dot{width:14px;height:14px;border-radius:50%}
button.bold-btn{font-weight:800;min-width:38px;padding:5px 12px}
.attach{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}.attach-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}.attach-list:empty{display:none}.attach-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.attach-item img,.attach-icon{width:44px;height:44px;flex:none;border-radius:6px;object-fit:cover}.attach-icon{display:flex;align-items:center;justify-content:center;background:#efedf5;color:#605773;font-size:10px;font-weight:700;text-transform:uppercase}.attach-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.attach-name small{display:block}.attach .error:empty{display:none}.file-links{display:flex;flex-direction:column;gap:4px;margin:6px 0}.file-links a{color:var(--accent);overflow-wrap:anywhere}
@media(max-width:480px){.brand .logo{height:30px}.brand-sub{font-size:10px}.grid{grid-template-columns:1fr}.card{padding:17px}main{margin-top:16px}.sig{height:170px}}@media print{header,footer,.no-print{display:none!important}main{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:none;break-inside:avoid}body{background:white}}
/* ===== Editor ringkas ===== */
.editor .card{padding:16px 18px;margin-bottom:10px}.editor .card.hero{border-top-width:7px}.editor-bar{position:sticky;top:0;z-index:5;background:#f3f1f9;padding:8px 0;margin-top:-8px}.editor-bar .bar{margin:0}.editor-bar .error{margin:8px 0 0}.editor-bar .error:empty{display:none}
.editor input.line-input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;margin:0 0 8px}.editor input.main-title{font-size:24px;font-weight:700}.editor input.sub-title{font-size:18px;font-weight:700}
.editor .rte{margin:0}.editor .rte-tools{margin:0 0 6px}.editor .rte-tools .tool{font-size:13px;padding:3px 9px}.editor .rte-area{padding:9px 11px}.editor .rte-count:empty{display:none}
.editor details{margin-top:10px;font-size:14px}.editor summary{cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:8px}.editor details label{font-size:14px}
.q-card{cursor:pointer;scroll-margin:70px 0 90px}.q-card.on{cursor:default;border-left:5px solid var(--accent)}.q-card:not(.on):hover{border-color:#b9aedd}.q-preview{margin:0 0 6px}.q-card:not(.on) .q-img{max-height:160px;margin:4px 0}
.q-top{display:flex;gap:8px;align-items:flex-end}.q-top .rte{flex:1;min-width:0}.editor select.q-type{width:190px;margin:0;height:44px;padding:8px}
.q-image{display:flex;align-items:flex-start;gap:6px;margin-top:8px}.q-image .q-img{max-height:220px;margin:0;min-width:0}
.opts{margin-top:8px}.opt{display:flex;align-items:center;gap:10px;min-height:32px;overflow-wrap:anywhere}.opt .mark{width:16px;flex:none;color:#6c687c;font-size:13px}.opt .mark.round,.opt .mark.square{height:16px;border:2px solid #b4aec4;border-radius:3px}.opt .mark.round{border-radius:50%}.editor .opt input{margin:0;padding:5px 2px;border:0;border-bottom:1px solid transparent;border-radius:0;flex:1;min-width:0}.editor .opt input:hover,.editor .opt input:focus{border-bottom-color:var(--line)}.editor button.add-opt{border:0;padding:5px 2px;color:#6c687c;font-weight:400}
.hint{color:#8b8799;font-size:14px;border-bottom:1px dotted #bbb5ca;padding:10px 0 4px;max-width:360px}
.q-foot{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:2px;border-top:1px solid var(--line);margin-top:14px;padding-top:8px}.q-foot .grow{flex:1}.editor select.copy-to{font-size:13px;padding:6px}
.editor button.icon-btn{border:0;background:transparent;color:#5c5870;padding:7px;border-radius:50%;display:inline-flex;flex:none}.editor button.icon-btn:hover{background:#efedf5;color:var(--accent)}
.editor label.req{display:flex;align-items:center;gap:8px;margin:0 0 0 8px;font-size:14px;font-weight:400;cursor:pointer}.editor details label.req{margin:0}
.editor input[role=switch]{appearance:none;width:36px;height:20px;border-radius:10px;background:#c5c0d3;position:relative;cursor:pointer;margin:0}.editor input[role=switch]::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}.editor input[role=switch]:checked{background:var(--accent)}.editor input[role=switch]:checked::after{left:18px}
.auto-note{color:#6c687c;font-size:12px;text-align:center;margin:4px 0 10px}.editor .page-head{margin:18px 0 8px}
.side-tools{position:fixed;z-index:6;left:calc(50% + 378px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 3px 12px #2d1c6226}
@media(max-width:860px){.side-tools{left:50%;top:auto;bottom:12px;transform:translateX(-50%);flex-direction:row;gap:18px;padding:6px 18px}.editor{padding-bottom:70px}}
@media(max-width:560px){.q-top{flex-wrap:wrap}.q-top .rte{flex-basis:calc(100% - 44px)}.editor select.q-type{width:100%}.editor .card{padding:13px}}
</style></head>

  if(typeof title!=='string'||!title.trim()||title.length>200||typeof desc!=='string'||desc.length>5000||typeof active!=='boolean')throw new Error('Judul/deskripsi tidak valid.');

  for(const f of form.fields){

        if(!seenPage.has(f.page)){seenPage.add(f.page);if(f.page>0){const m=meta(f.page);if(m.title.trim())o.pageTitle=m.title.trim();if(m.description.trim())o.pageDescription=m.description}}
        return o;
      })};
      if((model.description||'').length>5000||data.fields.some(f=>f.label.length>5000||(f.pageDescription||'').length>5000))throw new Error('Teks deskripsi atau pertanyaan melebihi 5000 karakter. Perpendek dulu.');
      const empty=model.fields.find(f=>!String(f.label).trim());

      const newImg=data.fields.reduce((s,f)=>s+(f.image&&String(f.image).startsWith('data:')?f.image.length:0),0);

  },'primary');
  setPage(el('div',{class:'editor'},
    el('div',{class:'editor-bar'},el('div',{class:'bar'},btn('Kembali',dashboard),el('strong',{},original?'Edit formulir':'Buat formulir'),save),e),
    el('section',{class:'card hero compact',style:'--accent:'+pageColor(0).accent},
      title,
      richEditor(model.description,v=>model.description=v,{label:'Deskripsi',placeholder:'Deskripsi formulir (opsional)',minHeight:44}),
      el('details',{},el('summary',{},'Pengaturan'),inputLabel('Nama formulir (khusus admin, tidak dilihat responden)',adminTitle),el('label',{class:'req'},active,'Terima jawaban (formulir aktif)'))),
    list,tools));
}
function signaturePad(title='Paraf'){const c=el('canvas',{class:'sig',width:1000,height:380,'aria-label':'Area paraf'}), ctx=c.getContext('2d');let strokes=[],cur=null,pointer=null;function pos(ev){const r=c.getBoundingClientRect();return [(ev.clientX-r.left)*c.width/r.width,(ev.clientY-r.top)*c.height/r.height]}function redraw(){ctx.clearRect(0,0,c.width,c.height);ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ctx.fillStyle='#202132';for(const s of strokes){ctx.beginPath();if(s.length===1){ctx.arc(s[0][0],s[0][1],2.5,0,Math.PI*2);ctx.fill()}else{ctx.moveTo(...s[0]);s.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke()}}}c.addEventListener('pointerdown',ev=>{if(cur||ev.button!==0)return;ev.preventDefault();pointer=ev.pointerId;c.setPointerCapture(pointer);cur=[pos(ev)];strokes.push(cur);redraw()});c.addEventListener('pointermove',ev=>{if(cur&&ev.pointerId===pointer){cur.push(pos(ev));redraw()}});function end(ev){if(ev.pointerId===pointer){cur=null;pointer=null}}for(const evt of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(evt,end);const ui=card(el('h3',{class:'q-title'},title+' ',el('span',{class:'required'},'*')),el('p',{class:'muted'},'Gunakan mouse atau jari untuk membuat paraf.'),c,actions(btn('Urungkan',()=>{strokes.pop();cur=null;redraw()}),btn('Hapus',()=>{strokes=[];cur=null;redraw()})));return {ui,valid:()=>strokes.some(s=>s.some(p=>Math.hypot(p[0]-s[0][0],p[1]-s[0][1])>4)),data:()=>c.toDataURL('image/png')}}
async function respondent(fid){
  topActions.replaceChildren();
  const f=await api('/api/public/'+fid);
  const readers={},files={};
  const buildQuestion=q=>{
    if(q.type==='description')return card(el('div',{class:'rich-block desc-block'},richBlock(q.label)),q.image?el('img',{class:'q-img',src:imgSrc(q.image),alt:''}):null);
    let controls;
    if(q.type==='radio'||q.type==='checkbox'){
      const nodes=q.options.map(v=>el('input',{type:q.type,name:q.id,value:v}));
      controls=q.options.map((v,i)=>el('label',{class:'choice'},nodes[i],v));
      readers[q.id]=()=>q.type==='checkbox'?nodes.filter(n=>n.checked).map(n=>n.value):(nodes.find(n=>n.checked)?.value||'');
    }else if(q.type==='image'){
      const MAXN=10,MAXB=1048576;
      let data=[];
      const grid=el('div',{class:'img-grid'}),note=el('p',{class:'error'}),info=el('p',{class:'muted'});
      const input=el('input',{type:'file',accept:'image/*',multiple:true,style:'display:none',onchange:async ev=>{
        const files=[...ev.target.files];ev.target.value='';
        const errs=[];
        for(const fl of files){
          if(data.length>=MAXN){errs.push('Maksimal '+MAXN+' gambar. Gambar selebihnya diabaikan.');break}
          if(fl.size>MAXB){errs.push('"'+fl.name+'" melebihi 1 MB.');continue}
          try{data.push(await compressImage(fl,250000))}catch(ex){errs.push('"'+fl.name+'": '+ex.message)}
        }
        note.textContent=errs.join('\n');draw();
      }});
      const pick=btn('Pilih / ambil gambar',()=>input.click());
      const draw=()=>{
        grid.replaceChildren(...data.map((d,k)=>el('div',{class:'img-thumb'},el('img',{src:d,alt:'Gambar '+(k+1)}),el('button',{type:'button',class:'danger',title:'Hapus gambar',onclick:()=>{data.splice(k,1);note.textContent='';draw()}},'✕'))));
        info.textContent=data.length+' / '+MAXN+' gambar · maksimal 1 MB per gambar';
        pick.disabled=data.length>=MAXN;
      };
      draw();
      controls=[grid,info,actions(pick),input,note];
      readers[q.id]=()=>data.slice();
    }else{
      let n;
      if(q.type==='select')n=el('select',{'aria-label':plain(q.label)},el('option',{value:''},'Pilih jawaban'),q.options.map(v=>el('option',{value:v},v)));
      else if(q.type==='long')n=el('textarea',{placeholder:'isilah hanya dengan angka (contoh: 100)',maxLength:10000,'aria-label':plain(q.label)});
      else n=el('input',{type:q.type==='date'?'date':'text',placeholder:'isilah hanya dengan angka (contoh: 100)',maxLength:10000,'aria-label':plain(q.label)});
      controls=[n];
      readers[q.id]=()=>n.value;
    }
    return card(el('div',{class:'q-title rich-block'+(hasFmt(q.label)?' rich':'')},richBlock(q.label,q.required?el('span',{class:'required'},' *'):null)),q.image?el('img',{class:'q-img',src:imgSrc(q.image),alt:''}):null,...controls);
  };
  const total=pageCountOf(f.fields);
  const nameInput=el('input',{type:'text',maxLength:200,placeholder:'Nama lengkap',autocomplete:'name','aria-label':'Nama pengisi (nama lengkap)'});
  const positionInput=el('input',{type:'text',maxLength:200,placeholder:'Contoh: Staf Keuangan / Divisi Operasional',autocomplete:'organization-title','aria-label':'Jabatan/Divisi'});
  const pages=[];
  for(let p=0;p<total;p++){
    const qs=f.fields.filter(q=>pageOf(q)===p);
    const nodes=[];
    if(p===0){
      nodes.push(el('section',{class:'card hero'},
        el('h1',{},f.title),
        el('hr',{class:'divider'}),
        f.description&&f.description.trim()?el('div',{class:'rich-block'},richBlock(f.description)):null,
        el('span',{class:'required'},'* Wajib diisi')));
      nodes.push(card(el('h3',{class:'q-title'},'Nama pengisi (nama lengkap) ',el('span',{class:'required'},'*')),nameInput));
      nodes.push(card(el('h3',{class:'q-title'},'Jabatan/Divisi ',el('span',{class:'required'},'*')),positionInput));
    }else{
      const firstQ=f.fields.find(q=>pageOf(q)===p);
      nodes.push(el('section',{class:'card hero'},el('h1',{},(firstQ&&firstQ.pageTitle)||f.title),el('hr',{class:'divider'}),firstQ&&firstQ.pageDescription?el('div',{class:'rich-block'},richBlock(firstQ.pageDescription)):null,el('span',{class:'required'},'* Wajib diisi')));
    }
    qs.forEach(q=>nodes.push(buildQuestion(q)));
    const pad=signaturePad('Paraf');
    nodes.push(pad.ui);
    const agree=el('input',{type:'checkbox'});
    nodes.push(el('label',{class:'agree-line'},agree,el('span',{},'Saya menyatakan bahwa data yang saya isi adalah benar dan dapat dipertanggungjawabkan.')));
    pages.push({qs,nodes,pad,agree});
  }
  let current=0;
  const e=err(),stepInfo=el('div',{class:'step-info muted'}),nav=el('div',{class:'actions nav'});
  const answerText=q=>{const v=readers[q.id]();return v};
  function checkPage(p){
    if(p===0&&!nameInput.value.trim())return 'Nama pengisi wajib diisi.';
    if(p===0&&!positionInput.value.trim())return 'Jabatan/Divisi wajib diisi.';
    for(const q of pages[p].qs){
      if(q.type==='description')continue;
      if(files[q.id]&&files[q.id].busy())return 'Tunggu sebentar, lampiran masih diproses.';
      const v=answerText(q);
      if(q.required&&(!v.length||(typeof v==='string'&&!v.trim())))return 'Wajib diisi: '+plain(q.label);
    }
    if(!pages[p].pad.valid())return 'Paraf wajib diisi. Buat coretan pada kotak paraf.';

  }
  let submitting=false;
  async function submit(){
    if(submitting)return;
    for(let p=0;p<total;p++){
      const msg=checkPage(p);

      const payload={revision:f.revision,name:nameInput.value.trim(),position:positionInput.value.trim(),answers,signatures:pages.map(x=>x.pad.data()),attachments:{}};
      if(JSON.stringify(payload).length>4100000)throw new Error('Total ukuran gambar dan paraf terlalu besar. Kurangi jumlah atau ukuran gambar.');
      // Lampiran diunggah satu per satu agar tidak melewati batas ukuran sekali kirim.
      for(let i=0;i<queue.length;i++){
        const {fieldId,item}=queue[i];
        progress.textContent='Mengunggah lampiran '+(i+1)+' dari '+queue.length+'…';
        if(!item.id)item.id=(await api('/api/public/'+fid+'/upload','POST',{fieldId,name:item.name,data:item.data})).id;
        (payload.attachments[fieldId]||(payload.attachments[fieldId]=[])).push(item.id);
      }
      progress.textContent='';
      const r=await api('/api/public/'+fid+'/submit','POST',payload);
      setPage(el('section',{class:'card hero',style:'--accent:'+pageColor(current).accent},el('h1',{},'Jawaban berhasil dikirim'),el('p',{},'Terima kasih. Jawaban dan paraf telah tersimpan.'),el('p',{class:'muted'},'ID respons: '+r.id),btn('Isi jawaban lain',()=>location.reload())));
    }catch(ex){
      if(ex.message.startsWith('Lampiran tidak ditemukan'))queue.forEach(x=>delete x.item.id);
      submitting=false;holder.inert=false;progress.textContent='';e.textContent=ex.message;render();
    }
  }
  const holder=el('div'),progress=el('p',{class:'muted',role:'status'});
  function render(){
    const pc=pageColor(current);form.style.setProperty('--accent',pc.accent);document.documentElement.style.background=pc.tint;
    holder.replaceChildren(...pages[current].nodes);
    stepInfo.textContent=total>1?'Halaman '+(current+1)+' dari '+total:'';
    const prev=btn('Kembali',()=>{e.textContent='';show(current-1)});
    prev.disabled=submitting;
    const isLast=current===total-1;
    const next=el('button',{type:'submit',class:'primary'},isLast?(submitting?'Mengirim…':'Kirim jawaban'):'Lanjut');
    next.disabled=submitting;
    nav.replaceChildren(...(current>0?[prev]:[]),next);
  }
  function show(p){current=p;render();window.scrollTo(0,0)}
  const form=el('form',{noValidate:true,onsubmit:ev=>{
    ev.preventDefault();e.textContent='';
    const msg=checkPage(current);
    if(msg){e.textContent=msg;return}
    if(current<total-1)show(current+1);else submit();
  }},stepInfo,holder,progress,e,nav);
  setPage(form);
  render();
}

function display(v){return Array.isArray(v)?v.join(', ')||'—':v||'—'}
const imgList=v=>Array.isArray(v)?v:(v?[v]:[]);

function detail(f,r){
