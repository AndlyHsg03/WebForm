<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FormTanda</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202132;background:#f3f1f9;font-size:16px;--accent:#6143b5;--line:#dedbe8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,calc((100vw - 1000px)/2));gap:12px}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--accent)}main{max-width:760px;margin:28px auto;padding:0 15px}footer{text-align:center;color:#777287;font-size:12px;padding:20px}h1{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:0 0 10px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}p{line-height:1.55;margin:8px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px;box-shadow:0 2px 6px #2d1c6210}.hero{border-top:7px solid var(--accent)}.bar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:16px}.muted,small{color:#6c687c;font-size:13px}.required,.error{color:#b3261e}.error{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;font-weight:550;margin-bottom:8px}input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid #d4d0df;border-radius:7px;background:#fff;color:#202132;margin:5px 0 12px}input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #8466e4;outline-offset:2px}textarea{resize:vertical;min-height:80px}button,.btn{border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:white;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:normal}button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.55;cursor:wait}button.danger{color:#a52d2 .divider{border:0;border-top:1px solid var(--line);margin:14px 0}.q-title{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.answer strong{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.agree-line{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;line-height:1.45;margin:4px 2px 14px;cursor:pointer}.agree-line input{width:14px;height:14px;margin:2px 0 0;flex:none}
h3.q-title.rich{font-weight:500}
button.bold-btn{font-weight:800;min-width:38px;padding:5px 12px}
@media(max-width:480px){.grid{grid-template-columns:1fr}.card{padding:17px}main{margin-top:16px}.sig{height:170px}}@media print{header,footer,.no-print{display:none!important}main{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:none;break-inside:avoid}body{background:white}}

<body><header><div class="brand">Form<span>Tanda</span></div><div id="top-actions"></div></header>
<main id="app" aria-live="polite"></main>
<footer>FormTanda · Formulir &amp; tanda tangan elektronik · Data tersimpan di server</footer>
<script>
'use strict';
/* ===== API server ===== */
async function api(path,method='GET',body){
  const response=await fetch(path,{method,credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Permintaan gagal.');
  return data;
}
function download(text,name,mime){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

/* ===== Validasi (port dari app.py) ===== */
const TYPES=['short','long','radio','checkbox','select','date'], CHOICE=['radio','checkbox','select'], PNG_PREFIX='data:image/png;base64,';
function checkedForm(b){
  const title=b.title,desc=b.description??'',fields=b.fields,active=b.active??true;
  if(typeof title!=='string'||!title.trim()||title.length>200||typeof desc!=='string'||desc.length>5000||typeof active!=='boolean')throw new Error('Judul/deskripsi tidak valid.');
  if(!Array.isArray(fields)||fields.length<1||fields.length>100)throw new Error('Tambahkan 1–100 pertanyaan.');
  const seen=new Set(),clean=[];
  for(const f of fields){
    if(!f||typeof f!=='object')throw new Error('Pertanyaan tidak valid.');
    const{id,label,type,required}=f;let options=f.options||[];
    if(typeof id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(id)||seen.has(id)||typeof label!=='string'||!label.trim()||label.length>500||!TYPES.includes(type)||typeof required!=='boolean')throw new Error('Periksa judul dan jenis pertanyaan.');
    seen.add(id);
    if(CHOICE.includes(type)){if(!Array.isArray(options)||options.length<2||options.length>100||options.some(o=>typeof o!=='string'||!o.trim()||o.length>300)||new Set(options).size!==options.length)throw new Error('Pertanyaan pilihan perlu minimal dua opsi unik.')}
    else options=[];
    clean.push({id,label:label.trim(),type,required,options});
  }
  return{title:title.trim(),description:desc,fields:clean,active};
}
function validateResponse(form,body){
  if(body.revision!==form.revision)throw new Error('Formulir berubah. Muat ulang halaman lalu isi kembali.');
  const answers=body.answers,result={};
  if(!answers||typeof answers!=='object'||Array.isArray(answers))throw new Error('Jawaban tidak valid.');
  for(const f of form.fields){
    let v=answers[f.id]??(f.type==='checkbox'?[]:'');
    if(f.type==='checkbox'){
      if(!Array.isArray(v)||v.some(x=>typeof x!=='string'||!f.options.includes(x))||new Set(v).size!==v.length)throw new Error('Pilihan tidak valid.');
    }else{
      if(typeof v!=='string'||v.length>10000)throw new Error('Jawaban terlalu panjang atau tidak valid.');
      v=v.trim();
      if(v&&(f.type==='radio'||f.type==='select')&&!f.options.includes(v))throw new Error('Pilihan tidak valid.');
      if(v&&f.type==='date'&&(!/^\d{4}-\d{2}-\d{2}$/.test(v)||isNaN(new Date(v+'T00:00:00Z'))))throw new Error('Tanggal tidak valid.');
    }
    if(f.required&&!v.length)throw new Error('Wajib diisi: '+f.label);
    result[f.id]=v;
  }
  const sig=body.signature;
  if(typeof sig!=='string'||!sig.startsWith(PNG_PREFIX)||sig.length>1500000||sig.length<100)throw new Error('Tanda tangan wajib diisi dan harus berupa PNG.');
  try{if(!atob(sig.slice(PNG_PREFIX.length,PNG_PREFIX.length+16)).startsWith('\x89PNG\r\n\x1a\n'))throw 0}catch{throw new Error('Tanda tangan tidak valid.')}
  return result;
}
const safeCsv=v=>{v=Array.isArray(v)?v.join('; '):String(v);return/^\s*[=+\-@]/.test(v)||/^[\t\r\n]/.test(v)?"'"+v:v};
const csvCell=v=>'"'+String(v).replace(/"/g,'""')+'"';

async function loadTable(f){
  const rows=await api('/api/admin/forms/'+f.id+'/responses');
  const list=[...rows].reverse();
  const cols=[],seen=new Set();
  const short=s=>{s=plain(s).replace(/\s+/g,' ').trim();return s.length>80?s.slice(0,77)+'…':s};
  const add=q=>{if(!seen.has(q.id)){seen.add(q.id);cols.push({id:q.id,label:short(q.label)})}};
  f.fields.forEach(add);
  list.forEach(r=>r.snapshot.fields.forEach(add));
  const head=['No','Waktu','Nama','Jabatan/Divisi',...cols.map(c=>c.label),'Tanda tangan','ID respons'];
  const body=list.map((r,i)=>[i+1,formatDate(r.created),r.name||'',r.position||'',...cols.map(c=>{const v=r.answers[c.id];return Array.isArray(v)?v.join(', '):(v??'')}),(Array.isArray(r.signatures)&&r.signatures.length?r.signatures.length:1)+' tersimpan',r.id]);
  return {head,body};
}
function fileBase(f){
  const slug=plain(f.adminTitle||f.title).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'formulir';
  return 'jawaban-'+slug+'-'+new Date().toISOString().slice(0,10);
}
async function downloadCsv(f){
  try{
    const {head,body}=await loadTable(f);
    const cell=v=>csvCell(typeof v==='number'?v:safeCsv(v));
    download('\ufeff'+[head,...body].map(r=>r.map(cell).join(',')).join('\r\n'),fileBase(f)+'.csv','text/csv;charset=utf-8');
  }catch(e){alert(e.message)}
}
const xmlEsc=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function crc32(b){let c=-1;for(let i=0;i<b.length;i++){c^=b[i];for(let k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1))}return(c^-1)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  const u16=n=>new Uint8Array([n&255,(n>>8)&255]);
  const u32=n=>new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]);
  const cat=(...a)=>{let len=0;a.forEach(x=>len+=x.length);const o=new Uint8Array(len);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
  const d=new Date(),time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const local=cat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(time),u16(date),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data);
    central.push(cat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(time),u16(date),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name));
    parts.push(local);offset+=local.length;
  }
  const cd=cat(...central);
  const end=cat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cd.length),u32(offset),u16(0));
  return new Blob([...parts,cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsx(head,body){
  const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',XML='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const cell=(r,c,v,s)=>{const ref=colName(c)+(r+1);if(typeof v==='number')return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;const t=String(v??'');if(t==='')return `<c r="${ref}" s="${s}"/>`;return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(t)}</t></is></c>`};
  const rows=[head,...body];
  const sheetData=rows.map((row,r)=>`<row r="${r+1}"${r===0?' ht="34" customHeight="1"':''}>`+row.map((v,c)=>cell(r,c,v,r===0?1:2)).join('')+'</row>').join('');
  const n=head.length;
  const widths=head.map((h,i)=>i===0?6:i===1?20:i<=3?26:i===n-2?16:i===n-1?26:32);
  const cols=widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const sheet=`${XML}<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane xSplit="3" ySplit="1" topLeftCell="D2" activePane="bottomRight" state="frozen"/><selection pane="topRight"/><selection pane="bottomLeft"/><selection pane="bottomRight"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${sheetData}</sheetData><autoFilter ref="A1:${colName(n-1)}${rows.length}"/></worksheet>`;
  const bc='<color rgb="FFBFB9CF"/>';
  const styles=`${XML}<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF6143B5"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin">${bc}</left><right style="thin">${bc}</right><top style="thin">${bc}</top><bottom style="thin">${bc}</bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',P='http://schemas.openxmlformats.org/package/2006/relationships';
  return makeZip([
    {name:'[Content_Types].xml',data:`${XML}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels',data:`${XML}<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`${XML}<workbook xmlns="${NS}" xmlns:r="${R}"><sheets><sheet name="Jawaban" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`${XML}<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:styles},
    {name:'xl/worksheets/sheet1.xml',data:sheet},
  ]);
}
async function downloadXlsx(f){
  try{
    const {head,body}=await loadTable(f);
    download(buildXlsx(head,body),fileBase(f)+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }catch(e){alert(e.message)}
}
function backupBar(){
  const file=el('input',{type:'file',accept:'application/json,.json',style:'display:none',onchange:async ev=>{
    const fl=ev.target.files[0];if(!fl)return;
    try{await api('/api/admin/restore','POST',JSON.parse(await fl.text()));alert('Data berhasil dipulihkan.');await dashboard()}
    catch(e){alert(e.message||'File cadangan tidak valid.')}
    ev.target.value='';
  }});
  return el('div',{class:'card'},
    el('p',{class:'muted'},'Data formulir dan respons tersimpan di server. Cadangkan secara berkala.'),
    actions(btn('Cadangkan data',async()=>{try{download(JSON.stringify(await api('/api/admin/backup')),'cadangan-formtanda-'+new Date().toISOString().slice(0,10)+'.json','application/json')}catch(e){alert(e.message)}}),btn('Pulihkan data',()=>file.click()),file));
}
async function showLogin(){
  topActions.replaceChildren();
  const pw=el('input',{type:'password',required:true,autocomplete:'current-password',placeholder:'Password akses'});
  const e=err(),submit=el('button',{type:'submit',class:'primary'},'Masuk');
  const f=el('form',{onsubmit:async ev=>{ev.preventDefault();submit.disabled=true;e.textContent='';
    try{
      await api('/api/login','POST',{password:pw.value});
      await route();
    }catch(ex){e.textContent=ex.message}finally{submit.disabled=false}}},
    inputLabel('Password akses',pw),submit,e);
  setPage(el('section',{class:'card hero'},el('h1',{},'Masuk'),el('p',{},'Masukkan password akses untuk membuka FormTanda.'),f));
}

const app=document.querySelector('#app'), topActions=document.querySelector('#top-actions');
const PAGE_COLORS=[{accent:'#2563eb',tint:'#eaf1ff'},{accent:'#16a34a',tint:'#e8f6ec'},{accent:'#b88900',tint:'#fdf5d8'}];
const pageColor=p=>PAGE_COLORS[p%PAGE_COLORS.length];
const types={short:'Jawaban pendek',long:'Paragraf',radio:'Pilihan ganda',checkbox:'Kotak centang',select:'Dropdown',date:'Tanggal'};
function el(tag,props={},...children){const x=document.createElement(tag);for(const [k,v] of Object.entries(props)){if(k==='class')x.className=v;else if(k.startsWith('on'))x.addEventListener(k.slice(2),v);else if(k==='text')x.textContent=v;else if(k in x)x[k]=v;else x.setAttribute(k,v)}for(const c of children.flat()){if(c!==null&&c!==undefined)x.append(c instanceof Node?c:document.createTextNode(String(c)))}return x}
const card=(...c)=>el('section',{class:'card'},...c), btn=(text,fn,cls='')=>el('button',{type:'button',class:cls,onclick:fn},text), err=()=>el('p',{class:'error',role:'alert'}), actions=(...c)=>el('div',{class:'actions'},...c);
function setPage(...nodes){document.documentElement.style.background='';app.replaceChildren(...nodes);window.scrollTo(0,0)}
function inputLabel(label,input){return el('label',{},label,input)}
function uid(){return 'q'+Math.random().toString(36).slice(2)+Date.now().toString(36)}
function newField(page=0){return {id:uid(),label:'',type:'short',required:true,options:[],page}}
function formatDate(s){return new Date(s).toLocaleString('id-ID')}
function adminHeader(){topActions.replaceChildren(btn('Keluar',async()=>{try{await api('/api/logout','POST',{});showLogin()}catch(e){alert(e.message)}}))}
async function dashboard(){adminHeader();const forms=await api('/api/admin/forms');const nodes=forms.map(f=>card(el('div',{class:'bar'},el('h2',{},f.adminTitle||f.title),el('span',{class:'tag'},f.active?'Aktif':'Ditutup')),f.adminTitle?el('p',{class:'muted'},'Judul di formulir: '+f.title):null,el('p',{class:'muted'},`${f.fields.length} pertanyaan · ${pageCountOf(f.fields)} halaman · ${f.count} jawaban`),actions(btn('Edit',()=>editor(f)),btn('Jawaban',()=>responses(f)),btn('Salin link',async()=>{const url=location.href.split('#')[0]+'#/f/'+f.id;try{await navigator.clipboard.writeText(url);alert('Link disalin.')}catch{prompt('Salin link formulir:',url)}}),el('a',{class:'btn',href:'#/f/'+f.id,target:'_blank',rel:'noopener'},'Buka formulir'),btn('Hapus',()=>deleteForm(f),'danger'))));setPage(el('div',{class:'bar'},el('div',{},el('h1',{},'Formulir saya'),el('span',{class:'muted'},'Kelola formulir dan respons.')),btn('+ Buat formulir',()=>editor(), 'primary')), backupBar(), ...(nodes.length?nodes:[el('div',{class:'card empty'},el('h2',{},'Belum ada formulir'),el('p',{},'Klik Buat formulir untuk memulai.'))]))}
async function deleteForm(f){
  const name=f.adminTitle||f.title;
  if(!confirm('Hapus formulir "'+name+'"?\n\nSemua '+f.count+' jawaban beserta tanda tangannya juga akan terhapus permanen dari database dan tidak bisa dikembalikan.\n\nSaran: klik Cadangkan data dulu sebelum menghapus.'))return;
  try{await api('/api/admin/forms/'+f.id,'DELETE');await dashboard()}catch(e){alert(e.message)}
}
function pageOf(q){return q.page||0}
function pageCountOf(fields){return Math.max(0,...fields.map(pageOf))+1}
const plain=s=>String(s).replace(/\*\*([^*]+?)\*\*/g,'$1');
function boldControl(ta,set){
  function toggle(){
    const s=ta.selectionStart,en=ta.selectionEnd,v=ta.value,sel=v.slice(s,en);
    let nv,cs,ce;
    if(sel.length>=4&&sel.startsWith('**')&&sel.endsWith('**')){nv=v.slice(0,s)+sel.slice(2,-2)+v.slice(en);cs=s;ce=en-4}
    else if(v.slice(s-2,s)==='**'&&v.slice(en,en+2)==='**'){nv=v.slice(0,s-2)+sel+v.slice(en+2);cs=s-2;ce=en-2}
    else{nv=v.slice(0,s)+'**'+sel+'**'+v.slice(en);cs=s+2;ce=en+2}
    ta.value=nv;set(nv);ta.focus();ta.setSelectionRange(cs,ce);
  }
  ta.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='b'){ev.preventDefault();toggle()}});

async function respondent(fid){

    }else{
      let n;

  };

  const pages=[];

      nodes.push(el('section',{class:'card hero'},
        el('h1',{},f.title),

function display(v){return Array.isArray(v)?v.join(', ')||'—':v||'—'}
function detail(f,r){
  const fields=r.snapshot.fields,total=pageCountOf(fields);
  const sigs=Array.isArray(r.signatures)&&r.signatures.length?r.signatures:[r.signature];
  const blocks=[];
  for(let p=0;p<total;p++){

    if(p===0&&r.name)blocks.push(el('div',{class:'answer'},el('strong',{},'Nama'),el('p',{},r.name)));
    if(p===0&&r.position)blocks.push(el('div',{class:'answer'},el('strong',{},'Jabatan/Divisi'),el('p',{},r.position)));
    fields.filter(q=>pageOf(q)===p).forEach(q=>blocks.push(el('div',{class:'answer'},el('strong',{},plain(q.label)),el('p',{},display(r.answers[q.id])))));
