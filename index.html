<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202132;background:#f3f1f9;font-size:16px;--accent:#6143b5;--line:#dedbe8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,calc((100vw - 1000px)/2));gap:12px}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--accent)}main{max-width:760px;margin:28px auto;padding:0 15px}footer{text-align:center;color:#777287;font-size:12px;padding:20px}h1{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:0 0 10px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}p{line-height:1.55;margin:8px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px;box-shadow:0 2px 6px #2d1c6210}.hero{border-top:7px solid var(--accent)}.bar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:16px}.muted,small{color:#6c687c;font-size:13px}.required,.error{color:#b3261e}.error{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;font-weight:550;margin-bottom:8px}input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid #d4d0df;border-radius:7px;background:#fff;color:#202132;margin:5px 0 12px}input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #8466e4;outline-offset:2px}textarea{resize:vertical;min-height:80px}button,.btn{border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:white;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:normal}button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.55;cursor:wait}button.danger{color:#a52d2 .divider{border:0;border-top:1px solid var(--line);margin:14px 0}.q-title{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.answer strong{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.agree-line{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;line-height:1.45;margin:4px 2px 14px;cursor:pointer}.agree-line input{width:14px;height:14px;margin:2px 0 0;flex:none}

<body><header><div class="brand">Form<span>Tanda</span></div><div id="top-actions"></div></header>
<main id="app" aria-live="polite"></main>
<footer>FormTanda · Formulir &amp; tanda tangan elektronik · Data tersimpan di server</footer>
<script>
'use strict';
/* ===== API server ===== */
async function api(path,method='GET',body){
  const response=await fetch(path,{method,credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Permintaan gagal.');
  return data;
}
function download(text,name,mime){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

/* ===== Validasi (port dari app.py) ===== */
const TYPES=['short','long','radio','checkbox','select','date'], CHOICE=['radio','checkbox','select'], PNG_PREFIX='data:image/png;base64,';
function checkedForm(b){
  const title=b.title,desc=b.description??'',fields=b.fields,active=b.active??true;
  if(typeof title!=='string'||!title.trim()||title.length>200||typeof desc!=='string'||desc.length>5000||typeof active!=='boolean')throw new Error('Judul/deskripsi tidak valid.');
  if(!Array.isArray(fields)||fields.length<1||fields.length>100)throw new Error('Tambahkan 1–100 pertanyaan.');
  const seen=new Set(),clean=[];
  for(const f of fields){
    if(!f||typeof f!=='object')throw new Error('Pertanyaan tidak valid.');
    const{id,label,type,required}=f;let options=f.options||[];
    if(typeof id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(id)||seen.has(id)||typeof label!=='string'||!label.trim()||label.length>500||!TYPES.includes(type)||typeof required!=='boolean')throw new Error('Periksa judul dan jenis pertanyaan.');
    seen.add(id);
    if(CHOICE.includes(type)){if(!Array.isArray(options)||options.length<2||options.length>100||options.some(o=>typeof o!=='string'||!o.trim()||o.length>300)||new Set(options).size!==options.length)throw new Error('Pertanyaan pilihan perlu minimal dua opsi unik.')}
    else options=[];
    clean.push({id,label:label.trim(),type,required,options});
  }
  return{title:title.trim(),description:desc,fields:clean,active};
}
function validateResponse(form,body){
  if(body.revision!==form.revision)throw new Error('Formulir berubah. Muat ulang halaman lalu isi kembali.');
  const answers=body.answers,result={};
  if(!answers||typeof answers!=='object'||Array.isArray(answers))throw new Error('Jawaban tidak valid.');
  for(const f of form.fields){
    let v=answers[f.id]??(f.type==='checkbox'?[]:'');
    if(f.type==='checkbox'){
      if(!Array.isArray(v)||v.some(x=>typeof x!=='string'||!f.options.includes(x))||new Set(v).size!==v.length)throw new Error('Pilihan tidak valid.');
    }else{
      if(typeof v!=='string'||v.length>10000)throw new Error('Jawaban terlalu panjang atau tidak valid.');
      v=v.trim();
      if(v&&(f.type==='radio'||f.type==='select')&&!f.options.includes(v))throw new Error('Pilihan tidak valid.');
      if(v&&f.type==='date'&&(!/^\d{4}-\d{2}-\d{2}$/.test(v)||isNaN(new Date(v+'T00:00:00Z'))))throw new Error('Tanggal tidak valid.');
    }
    if(f.required&&!v.length)throw new Error('Wajib diisi: '+f.label);
    result[f.id]=v;
  }
  const sig=body.signature;
  if(typeof sig!=='string'||!sig.startsWith(PNG_PREFIX)||sig.length>1500000||sig.length<100)throw new Error('Tanda tangan wajib diisi dan harus berupa PNG.');
  try{if(!atob(sig.slice(PNG_PREFIX.length,PNG_PREFIX.length+16)).startsWith('\x89PNG\r\n\x1a\n'))throw 0}catch{throw new Error('Tanda tangan tidak valid.')}
  return result;
}
const safeCsv=v=>{v=Array.isArray(v)?v.join('; '):String(v);return/^\s*[=+\-@]/.test(v)||/^[\t\r\n]/.test(v)?"'"+v:v};
const csvCell=v=>'"'+String(v).replace(/"/g,'""')+'"';

async function downloadCsv(f){
  try{
    const rows=await api('/api/admin/forms/'+f.id+'/responses');
    const out=[['ID respons','Waktu UTC','Nama','Jabatan/Divisi','Versi formulir','Halaman','Pertanyaan','Jawaban','Tanda tangan']];
    for(const r of rows)for(const q of r.snapshot.fields)out.push([r.id,r.created,safeCsv(r.name||''),safeCsv(r.position||''),r.snapshot.revision,(q.page||0)+1,safeCsv(q.label),safeCsv(r.answers[q.id]??''),'Tersimpan (lihat di aplikasi)']);
    download('\ufeff'+out.map(r=>r.map(csvCell).join(',')).join('\r\n'),'jawaban.csv','text/csv;charset=utf-8');
  }catch(e){alert(e.message)}
}
function backupBar(){
  const file=el('input',{type:'file',accept:'application/json,.json',style:'display:none',onchange:async ev=>{
    const fl=ev.target.files[0];if(!fl)return;
    try{await api('/api/admin/restore','POST',JSON.parse(await fl.text()));alert('Data berhasil dipulihkan.');await dashboard()}
    catch(e){alert(e.message||'File cadangan tidak valid.')}
    ev.target.value='';
  }});
  return el('div',{class:'card'},
    el('p',{class:'muted'},'Data formulir dan respons tersimpan di server. Cadangkan secara berkala.'),
    actions(btn('Cadangkan data',async()=>{try{download(JSON.stringify(await api('/api/admin/backup')),'cadangan-formtanda-'+new Date().toISOString().slice(0,10)+'.json','application/json')}catch(e){alert(e.message)}}),btn('Pulihkan data',()=>file.click()),file));
}
async function showLogin(){
  topActions.replaceChildren();
  const pw=el('input',{type:'password',required:true,autocomplete:'current-password',placeholder:'Password akses'});
  const e=err(),submit=el('button',{type:'submit',class:'primary'},'Masuk');
  const f=el('form',{onsubmit:async ev=>{ev.preventDefault();submit.disabled=true;e.textContent='';
    try{
      await api('/api/login','POST',{password:pw.value});
      await route();
    }catch(ex){e.textContent=ex.message}finally{submit.disabled=false}}},
    inputLabel('Password akses',pw),submit,e);
  setPage(el('section',{class:'card hero'},el('h1',{},'Masuk'),el('p',{},'Masukkan password akses untuk membuka FormTanda.'),f));
}

const app=document.querySelector('#app'), topActions=document.querySelector('#top-actions');
const types={short:'Jawaban pendek',long:'Paragraf',radio:'Pilihan ganda',checkbox:'Kotak centang',select:'Dropdown',date:'Tanggal'};
function el(tag,props={},...children){const x=document.createElement(tag);for(const [k,v] of Object.entries(props)){if(k==='class')x.className=v;else if(k.startsWith('on'))x.addEventListener(k.slice(2),v);else if(k==='text')x.textContent=v;else if(k in x)x[k]=v;else x.setAttribute(k,v)}for(const c of children.flat()){if(c!==null&&c!==undefined)x.append(c instanceof Node?c:document.createTextNode(String(c)))}return x}
const card=(...c)=>el('section',{class:'card'},...c), btn=(text,fn,cls='')=>el('button',{type:'button',class:cls,onclick:fn},text), err=()=>el('p',{class:'error',role:'alert'}), actions=(...c)=>el('div',{class:'actions'},...c);
function setPage(...nodes){app.replaceChildren(...nodes);window.scrollTo(0,0)}
function inputLabel(label,input){return el('label',{},label,input)}
function uid(){return 'q'+Math.random().toString(36).slice(2)+Date.now().toString(36)}
function newField(page=0){return {id:uid(),label:'',type:'short',required:true,options:[],page}}
function formatDate(s){return new Date(s).toLocaleString('id-ID')}
function adminHeader(){topActions.replaceChildren(btn('Keluar',async()=>{try{await api('/api/logout','POST',{});showLogin()}catch(e){alert(e.message)}}))}
async function dashboard(){adminHeader();const forms=await api('/api/admin/forms');const nodes=forms.map(f=>card(el('div',{class:'bar'},el('h2',{},f.title),el('span',{class:'tag'},f.active?'Aktif':'Ditutup')),el('p',{class:'muted'},`${f.fields.length} pertanyaan · ${pageCountOf(f.fields)} halaman · ${f.count} jawaban`),actions(btn('Edit',()=>editor(f)),btn('Jawaban',()=>responses(f)),btn('Salin link',async()=>{const url=location.href.split('#')[0]+'#/f/'+f.id;try{await navigator.clipboard.writeText(url);alert('Link disalin.')}catch{prompt('Salin link formulir:',url)}}),el('a',{class:'btn',href:'#/f/'+f.id,target:'_blank',rel:'noopener'},'Buka formulir'))));setPage(el('div',{class:'bar'},el('div',{},el('h1',{},'Formulir saya'),el('span',{class:'muted'},'Kelola formulir dan respons.')),btn('+ Buat formulir',()=>editor(), 'primary')), backupBar(), ...(nodes.length?nodes:[el('div',{class:'card empty'},el('h2',{},'Belum ada formulir'),el('p',{},'Klik Buat formulir untuk memulai.'))]))}
function pageOf(q){return q.page||0}
function pageCountOf(fields){return Math.max(0,...fields.map(pageOf))+1}
function editor(original){
  const model=original?JSON.parse(JSON.stringify(original)):{title:'',description:'',active:true,fields:[newField(0)]};
  model.fields.forEach(f=>{f.page=pageOf(f)});
  model.fields.sort((a,b)=>a.page-b.page);
  const list=el('div'),e=err();
  const title=el('input',{value:model.title,placeholder:'Contoh: Formulir Serah Terima Barang',maxLength:200,oninput:ev=>model.title=ev.target.value});
  const description=el('textarea',{value:model.description,placeholder:'Petunjuk pengisian (opsional)',maxLength:5000,oninput:ev=>model.description=ev.target.value});
  const active=el('input',{type:'checkbox',checked:model.active,onchange:ev=>model.active=ev.target.checked});
  const MAX_PAGES=10;
  function addQuestion(page){
    if(model.fields.length>=100)return alert('Maksimal 100 pertanyaan.');
    let at=model.fields.length;
    for(let i=model.fields.length-1;i>=0;i--){if(model.fields[i].page===page){at=i+1;break}}
    model.fields.splice(at,0,newField(page));
    renderFields();
  }
  function move(f,dir){
    const same=model.fields.filter(x=>x.page===f.page);
    const idx=same.indexOf(f),other=same[idx+dir];
    if(!other)return;
    const a=model.fields.indexOf(f),b=model.fields.indexOf(other);
    [model.fields[a],model.fields[b]]=[model.fields[b],model.fields[a]];
    renderFields();
  }
  function removeQuestion(f){
    if(model.fields.filter(x=>x.page===f.page).length<=1)return alert('Minimal satu pertanyaan per halaman. Hapus halaman jika tidak diperlukan.');
    model.fields.splice(model.fields.indexOf(f),1);
    renderFields();
  }
  function removePage(page){
    if(!confirm('Hapus halaman '+(page+1)+' beserta semua pertanyaannya?'))return;
    model.fields=model.fields.filter(f=>f.page!==page);
    model.fields.forEach(f=>{if(f.page>page)f.page-=1});
    renderFields();
  }
  function addPage(){
    const count=pageCountOf(model.fields);
    if(count>=MAX_PAGES)return alert('Maksimal '+MAX_PAGES+' halaman.');
    if(model.fields.length>=100)return alert('Maksimal 100 pertanyaan.');
    model.fields.push(newField(count));
    renderFields();
  }
  function questionCard(f,number,pageSize,pos){
    const label=el('textarea',{value:f.label,placeholder:'Tulis pertanyaan (tekan Enter untuk baris baru)',maxLength:5000,rows:4,style:'min-height:110px',oninput:ev=>f.label=ev.target.value});
    const typ=el('select',{onchange:ev=>{f.type=ev.target.value;if(['radio','checkbox','select'].includes(f.type)&&f.options.length<2)f.options=['Pilihan 1','Pilihan 2'];renderFields()}},Object.entries(types).map(([k,v])=>el('option',{value:k,selected:k===f.type},v)));
    const req=el('input',{type:'checkbox',checked:f.required,onchange:ev=>f.required=ev.target.checked});
    const options=el('textarea',{value:f.options.join('\n'),placeholder:'Satu pilihan per baris',oninput:ev=>f.options=ev.target.value.split('\n')});
    return card(
      el('div',{class:'question-head'},el('h3',{},'Pertanyaan '+number),actions(btn('↑',()=>move(f,-1)),btn('↓',()=>move(f,1)),btn('Hapus',()=>removeQuestion(f),'danger'))),
      inputLabel('Pertanyaan',label),inputLabel('Jenis jawaban',typ),
      ['radio','checkbox','select'].includes(f.type)?inputLabel('Pilihan jawaban (satu per baris)',options):null,
      el('label',{class:'choice'},req,'Wajib diisi'));
  }
  function renderFields(){
    const count=pageCountOf(model.fields);
    const nodes=[];
    for(let p=0;p<count;p++){
      const inPage=model.fields.filter(f=>f.page===p);
      nodes.push(el('div',{class:'page-head'},el('h2',{},'Halaman '+(p+1)+(count>1?' dari '+count:'')),count>1?btn('Hapus halaman',()=>removePage(p),'danger'):null));
      if(p===0)nodes.push(card(el('h3',{},'Nama dan Jabatan/Divisi responden (wajib)'),el('p',{class:'muted'},'Otomatis tampil di halaman 1, tepat di bawah judul dan deskripsi formulir.')));
      inPage.forEach((f,i)=>nodes.push(questionCard(f,i+1,inPage.length,i)));
      nodes.push(actions(btn('+ Tambah pertanyaan',()=>addQuestion(p))));
      nodes.push(el('div',{class:'spacer'}));
      nodes.push(card(el('h3',{},'Tanda tangan halaman '+(p+1)+' (wajib)'),el('p',{class:'muted'},'Otomatis ditempatkan di bagian bawah halaman ini. Responden dapat menandatangani dengan mouse atau jari.')));
    }
    nodes.push(el('div',{class:'spacer'}));
    nodes.push(actions(btn('+ Tambah halaman',addPage)));
    list.replaceChildren(...nodes);
  }
  renderFields();
  const save=btn('Simpan formulir',async()=>{
    e.textContent='';save.disabled=true;
    try{
      const data={...model,fields:model.fields.map(f=>({...f,options:f.options.map(o=>o.trim()).filter(Boolean)}))};
      await api(original?'/api/admin/forms/'+original.id:'/api/admin/forms',original?'PUT':'POST',data);
      await dashboard();
    }catch(ex){e.textContent=ex.message;e.scrollIntoView({block:'nearest'})}finally{save.disabled=false}
  },'primary');
  setPage(el('div',{class:'bar'},el('h1',{},original?'Edit formulir':'Buat formulir'),btn('Kembali',dashboard)),
    el('section',{class:'card hero'},inputLabel('Judul formulir',title),inputLabel('Deskripsi',description),el('label',{class:'choice'},active,'Terima jawaban (formulir aktif)')),
    list,el('div',{class:'spacer'}),actions(save,btn('Batal',dashboard)),e);
}
function signaturePad(title='Tanda tangan'){const c=el('canvas',{class:'sig',width:1000,height:380,'aria-label':'Area tanda tangan'}), ctx=c.getContext('2d');let strokes=[],cur=null,pointer=null;function pos(ev){const r=c.getBoundingClientRect();return [(ev.clientX-r.left)*c.width/r.width,(ev.clientY-r.top)*c.height/r.height]}function redraw(){ctx.clearRect(0,0,c.width,c.height);ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ctx.fillStyle='#202132';for(const s of strokes){ctx.beginPath();if(s.length===1){ctx.arc(s[0][0],s[0][1],2.5,0,Math.PI*2);ctx.fill()}else{ctx.moveTo(...s[0]);s.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke()}}}c.addEventListener('pointerdown',ev=>{if(cur||ev.button!==0)return;ev.preventDefault();pointer=ev.pointerId;c.setPointerCapture(pointer);cur=[pos(ev)];strokes.push(cur);redraw()});c.addEventListener('pointermove',ev=>{if(cur&&ev.pointerId===pointer){cur.push(pos(ev));redraw()}});function end(ev){if(ev.pointerId===pointer){cur=null;pointer=null}}for(const evt of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(evt,end);const ui=card(el('h3',{class:'q-title'},title+' ',el('span',{class:'required'},'*')),el('p',{class:'muted'},'Gunakan mouse atau jari untuk tanda tangan.'),c,actions(btn('Urungkan',()=>{strokes.pop();cur=null;redraw()}),btn('Hapus',()=>{strokes=[];cur=null;redraw()})));return {ui,valid:()=>strokes.some(s=>s.some(p=>Math.hypot(p[0]-s[0][0],p[1]-s[0][1])>4)),data:()=>c.toDataURL('image/png')}}
async function respondent(fid){
  topActions.replaceChildren();
  const f=await api('/api/public/'+fid);
  const readers={};
  const buildQuestion=q=>{
    let controls;
    if(q.type==='radio'||q.type==='checkbox'){
      const nodes=q.options.map(v=>el('input',{type:q.type,name:q.id,value:v}));
      controls=q.options.map((v,i)=>el('label',{class:'choice'},nodes[i],v));
      readers[q.id]=()=>q.type==='checkbox'?nodes.filter(n=>n.checked).map(n=>n.value):(nodes.find(n=>n.checked)?.value||'');
    }else{
      let n;
      if(q.type==='select')n=el('select',{'aria-label':q.label},el('option',{value:''},'Pilih jawaban'),q.options.map(v=>el('option',{value:v},v)));
      else if(q.type==='long')n=el('textarea',{placeholder:'Jawaban Anda',maxLength:10000,'aria-label':q.label});
      else n=el('input',{type:q.type==='date'?'date':'text',placeholder:'Jawaban Anda',maxLength:10000,'aria-label':q.label});
      controls=[n];
      readers[q.id]=()=>n.value;
    }
    return card(el('h3',{class:'q-title'},q.label,q.required?el('span',{class:'required'},' *'):null),...controls);
  };
  const total=pageCountOf(f.fields);
  const nameInput=el('input',{type:'text',maxLength:200,placeholder:'Nama lengkap',autocomplete:'name','aria-label':'Nama'});
  const positionInput=el('input',{type:'text',maxLength:200,placeholder:'Contoh: Staf Keuangan / Divisi Operasional',autocomplete:'organization-title','aria-label':'Jabatan/Divisi'});
  const pages=[];
  for(let p=0;p<total;p++){
    const qs=f.fields.filter(q=>pageOf(q)===p);
    const nodes=[];
    if(p===0){
      nodes.push(el('section',{class:'card hero'},
        el('h1',{},f.title),
        el('hr',{class:'divider'}),
        f.description?el('p',{},f.description):null,
        el('span',{class:'required'},'* Wajib diisi')));
      nodes.push(card(el('h3',{class:'q-title'},'Nama ',el('span',{class:'required'},'*')),nameInput));
      nodes.push(card(el('h3',{class:'q-title'},'Jabatan/Divisi ',el('span',{class:'required'},'*')),positionInput));
    }
    qs.forEach(q=>nodes.push(buildQuestion(q)));
    const pad=signaturePad('Tanda tangan'+(total>1?' halaman '+(p+1):''));
    nodes.push(pad.ui);
    pages.push({qs,nodes,pad});
  }
  const agree=el('input',{type:'checkbox'});
  const agreeLine=el('label',{class:'agree-line'},agree,el('span',{},'Saya menyatakan bahwa data yang saya isi adalah benar dan dapat dipertanggungjawabkan.'));
  let current=0;
  const e=err(),stepInfo=el('div',{class:'step-info muted'}),nav=el('div',{class:'actions nav'});
  const answerText=q=>{const v=readers[q.id]();return v};
  function checkPage(p){
    if(p===0&&!nameInput.value.trim())return 'Nama wajib diisi.';
    if(p===0&&!positionInput.value.trim())return 'Jabatan/Divisi wajib diisi.';
    for(const q of pages[p].qs){
      const v=answerText(q);
      if(q.required&&(!v.length||(typeof v==='string'&&!v.trim())))return 'Wajib diisi: '+q.label;
    }
    if(!pages[p].pad.valid())return 'Tanda tangan wajib diisi. Buat coretan pada kotak tanda tangan.';
    if(p===total-1&&!agree.checked)return 'Centang pernyataan bahwa data yang Anda isi adalah benar.';
    return '';
  }
  let submitting=false;
  async function submit(){
    if(submitting)return;
    for(let p=0;p<total;p++){
      const msg=checkPage(p);
      if(msg){show(p);e.textContent=(total>1?'Halaman '+(p+1)+': ':'')+msg;return}
    }
    submitting=true;render();
    try{
      const answers=Object.fromEntries(f.fields.map(q=>[q.id,readers[q.id]()]));
      const r=await api('/api/public/'+fid+'/submit','POST',{revision:f.revision,name:nameInput.value.trim(),position:positionInput.value.trim(),answers,signatures:pages.map(x=>x.pad.data())});
      setPage(el('section',{class:'card hero'},el('h1',{},'Jawaban berhasil dikirim'),el('p',{},'Terima kasih. Jawaban dan tanda tangan telah tersimpan.'),el('p',{class:'muted'},'ID respons: '+r.id),btn('Isi jawaban lain',()=>location.reload())));
    }catch(ex){submitting=false;e.textContent=ex.message;render()}
  }
  const holder=el('div');
  function render(){
    holder.replaceChildren(...pages[current].nodes);
    stepInfo.textContent=total>1?'Halaman '+(current+1)+' dari '+total:'';
    const prev=btn('Kembali',()=>{e.textContent='';show(current-1)});
    prev.disabled=submitting;
    const isLast=current===total-1;
    agreeLine.style.display=isLast?'':'none';
    const next=el('button',{type:'submit',class:'primary'},isLast?(submitting?'Mengirim…':'Kirim jawaban'):'Lanjut');
    next.disabled=submitting;
    nav.replaceChildren(...(current>0?[prev]:[]),next);
  }
  function show(p){current=p;render();window.scrollTo(0,0)}
  const form=el('form',{noValidate:true,onsubmit:ev=>{
    ev.preventDefault();e.textContent='';
    const msg=checkPage(current);
    if(msg){e.textContent=msg;return}
    if(current<total-1)show(current+1);else submit();
  }},stepInfo,holder,agreeLine,e,nav);
  render();
  setPage(form);
}
async function responses(f){
  try{
    const rows=await api('/api/admin/forms/'+f.id+'/responses');
    setPage(el('div',{class:'bar'},el('div',{},el('h1',{},'Jawaban responden'),el('p',{},f.title+' · '+rows.length+' respons')),btn('Kembali',dashboard)),
      actions(btn('Unduh CSV (Excel)',()=>downloadCsv(f),'primary')),el('div',{class:'spacer'}),
      ...(rows.length?rows.map((r,i)=>{
        const first=r.snapshot.fields[0];
        return card(el('div',{class:'bar'},el('h3',{},'Respons '+(rows.length-i)),el('span',{class:'muted'},formatDate(r.created))),
          r.name?el('p',{},'Nama: '+r.name):null,
          r.position?el('p',{},'Jabatan/Divisi: '+r.position):null,
          first?el('p',{},first.label+': '+display(r.answers[first.id])):null,
          btn('Lihat detail & tanda tangan',()=>detail(f,r)));
      }):[card(el('p',{},'Belum ada jawaban. Bagikan link formulir untuk mulai.'))]));
  }catch(e){setPage(card(el('p',{class:'error'},e.message),btn('Kembali',dashboard)))}
}
function display(v){return Array.isArray(v)?v.join(', ')||'—':v||'—'}
function detail(f,r){
  const fields=r.snapshot.fields,total=pageCountOf(fields);
  const sigs=Array.isArray(r.signatures)&&r.signatures.length?r.signatures:[r.signature];
  const blocks=[];
  for(let p=0;p<total;p++){
    if(total>1)blocks.push(el('h2',{class:'page-title'},'Halaman '+(p+1)));
    if(p===0&&r.name)blocks.push(el('div',{class:'answer'},el('strong',{},'Nama'),el('p',{},r.name)));
    if(p===0&&r.position)blocks.push(el('div',{class:'answer'},el('strong',{},'Jabatan/Divisi'),el('p',{},r.position)));
    fields.filter(q=>pageOf(q)===p).forEach(q=>blocks.push(el('div',{class:'answer'},el('strong',{},q.label),el('p',{},display(r.answers[q.id])))));
    blocks.push(el('h3',{},'Tanda tangan'+(total>1?' halaman '+(p+1):'')));
    if(sigs[p])blocks.push(el('img',{class:'signature-image',src:sigs[p],alt:'Tanda tangan responden halaman '+(p+1)}));
  }
  setPage(el('div',{class:'bar no-print'},btn('Kembali',()=>responses(f)),btn('Cetak / Simpan PDF',()=>window.print(),'primary')),
    card(el('h1',{},r.snapshot.title),el('p',{class:'muted'},'ID: '+r.id+' · '+formatDate(r.created)),...blocks));
}

async function route(){try{const m=location.hash.match(/^#\/f\/([a-f0-9]{24})$/);if(m){await respondent(m[1]);return}const s=await api('/api/session');if(s.admin)await dashboard();else await showLogin()}catch(e){setPage(card(el('h1',{},'Tidak dapat membuka halaman'),el('p',{class:'error'},e.message),btn('Muat ulang',()=>location.reload())))}}
addEventListener('hashchange',route);route();

</script></body></html>
