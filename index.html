<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Penilaian SLA MKP</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202132;background:#f3f1f9;font-size:16px;--accent:#6143b5;--line:#dedbe8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,calc((100vw - 1000px)/2));gap:12px}.brand{display:flex;flex-direction:column;gap:5px}.brand .logo{height:38px;width:auto;display:block;align-self:flex-start}.brand-sub{font-size:11px;font-weight:700;color:#6c687c;text-transform:uppercase;letter-spacing:.3em;text-align:justify;text-align-last:justify;line-height:1}.brand span{color:var(--accent)}main{max-width:760px;margin:28px auto;padding:0 15px}footer{text-align:center;color:#777287;font-size:12px;padding:20px}h1{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:0 0 10px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}p{line-height:1.55;margin:8px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px;box-shadow:0 2px 6px #2d1c6210}.hero{border-top:7px solid var(--accent)}.bar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:16px}.muted,small{color:#6c687c;font-size:13px}.required,.error{color:#b3261e}.error{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;font-weight:550;margin-bottom:8px}input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid #d4d0df;border-radius:7px;background:#fff;color:#202132;margin:5px 0 12px}input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #8466e4;outline-offset:2px}textarea{resize:vertical;min-height:80px}button,.btn{border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:white;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:normal}button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.55;cursor:wait}button.danger{color:#a52d25}.choice{display:flex;align-items:center;gap:10px;font-weight:400;margin:12px 0;overflow-wrap:anywhere}input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px;flex:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tag{font-size:12px;background:#efedf5;border-radius:12px;padding:4px 9px;color:#605773}.sig{width:100%;height:190px;background:white;border:1px dashed #aaa4b7;border-radius:8px;touch-action:none;cursor:crosshair;display:block;margin:12px 0}.signature-image{max-width:100%;max-height:190px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}.question-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.answer{border-bottom:1px solid var(--line);padding:8px 0}.answer:last-child{border:0}.answer p{margin:4px 0 8px}.empty{text-align:center;padding:35px 20px}.spacer{height:10px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px;padding-top:6px;border-top:2px solid var(--line)}.page-head h2{margin:0}.step-info{margin:0 0 12px;font-weight:600}.nav{margin:6px 0 24px}.page-title{margin:20px 0 6px;color:var(--accent)}
.divider{border:0;border-top:1px solid var(--line);margin:14px 0}.q-title{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;line-height:1.5}div.q-title{font-size:17px;font-weight:700}.answer strong{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.agree-line{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;line-height:1.45;margin:4px 2px 14px;cursor:pointer}.agree-line input{width:14px;height:14px;margin:2px 0 0;flex:none}
.q-title.rich{font-weight:500}
.rich-block{line-height:1.55;margin:8px 0 14px;overflow-wrap:anywhere}.rich-block .ln,.rich-block li{white-space:pre-wrap;min-height:1.55em}.rich-block ul,.rich-block ol{margin:4px 0;padding-left:26px}.rich-block li{margin:3px 0;padding-left:3px}.q-title.rich-block{margin:0 0 14px}
.field-label{font-weight:550;margin-bottom:6px}.rte{margin:2px 0 14px}.rte-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:8px 0}.img-grid:empty{display:none}.img-thumb{position:relative}.img-thumb img{width:100%;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:8px;display:block}.img-thumb button{position:absolute;top:4px;right:4px;padding:0 7px;border-radius:50%;background:#fff;line-height:1.5;font-size:13px}.answer-imgs{display:flex;flex-wrap:wrap;gap:10px}.answer-imgs img.q-img{max-width:calc(50% - 5px);max-height:320px;margin:6px 0}
img.q-img{max-width:100%;max-height:420px;border:1px solid var(--line);border-radius:8px;display:block;margin:6px 0 14px;object-fit:contain;background:#fff}.img-prev:empty{display:none}.img-field{margin:2px 0 14px}.desc-block{margin:0}
select.copy-to{width:auto;margin:0;padding:8px 10px;font-size:14px;font-weight:600;color:var(--accent)}button.tool{padding:5px 12px;font-size:14px;min-width:40px}
.rte-area{padding:11px 12px;border:1px solid #d4d0df;border-radius:7px;background:#fff;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}.rte-area:focus{outline:2px solid #8466e4;outline-offset:2px}.rte-area:empty::before{content:attr(data-ph);color:#8b8799;pointer-events:none}.rte-area ul,.rte-area ol{margin:4px 0;padding-left:26px}.rte-area div{min-height:1.55em}.rte-count{text-align:right;margin-top:4px}
button.bold-btn{font-weight:800;min-width:38px;padding:5px 12px}
.attach{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}.attach-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}.attach-list:empty{display:none}.attach-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.attach-item img,.attach-icon{width:44px;height:44px;flex:none;border-radius:6px;object-fit:cover}.attach-icon{display:flex;align-items:center;justify-content:center;background:#efedf5;color:#605773;font-size:10px;font-weight:700;text-transform:uppercase}.attach-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.attach-name small{display:block}.attach .error:empty{display:none}.file-links{display:flex;flex-direction:column;gap:4px;margin:6px 0}.file-links a{color:var(--accent);overflow-wrap:anywhere}
@media(max-width:480px){.brand .logo{height:30px}.brand-sub{font-size:10px}.grid{grid-template-columns:1fr}.card{padding:17px}main{margin-top:16px}.sig{height:170px}}@media print{header,footer,.no-print{display:none!important}main{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:none;break-inside:avoid}body{background:white}}

<script>
'use strict';
/* ===== API server ===== */
async function api(path,method='GET',body){
  const response=await fetch(path,{method,credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Permintaan gagal.');
  return data;
}
function download(text,name,mime){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

/* ===== Validasi (port dari app.py) ===== */
const TYPES=['short','long','radio','checkbox','select','date'], CHOICE=['radio','checkbox','select'], PNG_PREFIX='data:image/png;base64,';
function checkedForm(b){
  const title=b.title,desc=b.description??'',fields=b.fields,active=b.active??true;
  if(typeof title!=='string'||!title.trim()||title.length>200||typeof desc!=='string'||desc.length>5000||typeof active!=='boolean')throw new Error('Judul/deskripsi tidak valid.');
  if(!Array.isArray(fields)||fields.length<1||fields.length>100)throw new Error('Tambahkan 1–100 pertanyaan.');
  const seen=new Set(),clean=[];
  for(const f of fields){
    if(!f||typeof f!=='object')throw new Error('Pertanyaan tidak valid.');
    const{id,label,type,required}=f;let options=f.options||[];
    if(typeof id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(id)||seen.has(id)||typeof label!=='string'||!label.trim()||label.length>500||!TYPES.includes(type)||typeof required!=='boolean')throw new Error('Periksa judul dan jenis pertanyaan.');
    seen.add(id);
    if(CHOICE.includes(type)){if(!Array.isArray(options)||options.length<2||options.length>100||options.some(o=>typeof o!=='string'||!o.trim()||o.length>300)||new Set(options).size!==options.length)throw new Error('Pertanyaan pilihan perlu minimal dua opsi unik.')}
    else options=[];
    clean.push({id,label:label.trim(),type,required,options});
  }
  return{title:title.trim(),description:desc,fields:clean,active};
}
function validateResponse(form,body){
  if(body.revision!==form.revision)throw new Error('Formulir berubah. Muat ulang halaman lalu isi kembali.');
  const answers=body.answers,result={};
  if(!answers||typeof answers!=='object'||Array.isArray(answers))throw new Error('Jawaban tidak valid.');
  for(const f of form.fields){
    let v=answers[f.id]??(f.type==='checkbox'?[]:'');
    if(f.type==='checkbox'){
      if(!Array.isArray(v)||v.some(x=>typeof x!=='string'||!f.options.includes(x))||new Set(v).size!==v.length)throw new Error('Pilihan tidak valid.');
    }else{
      if(typeof v!=='string'||v.length>10000)throw new Error('Jawaban terlalu panjang atau tidak valid.');
      v=v.trim();
      if(v&&(f.type==='radio'||f.type==='select')&&!f.options.includes(v))throw new Error('Pilihan tidak valid.');
      if(v&&f.type==='date'&&(!/^\d{4}-\d{2}-\d{2}$/.test(v)||isNaN(new Date(v+'T00:00:00Z'))))throw new Error('Tanggal tidak valid.');
    }
    if(f.required&&!v.length)throw new Error('Wajib diisi: '+f.label);
    result[f.id]=v;
  }
  const sig=body.signature;
  if(typeof sig!=='string'||!sig.startsWith(PNG_PREFIX)||sig.length>1500000||sig.length<100)throw new Error('Tanda tangan wajib diisi dan harus berupa PNG.');
  try{if(!atob(sig.slice(PNG_PREFIX.length,PNG_PREFIX.length+16)).startsWith('\x89PNG\r\n\x1a\n'))throw 0}catch{throw new Error('Tanda tangan tidak valid.')}
  return result;
}
const safeCsv=v=>{v=Array.isArray(v)?v.join('; '):String(v);return/^\s*[=+\-@]/.test(v)||/^[\t\r\n]/.test(v)?"'"+v:v};
const csvCell=v=>'"'+String(v).replace(/"/g,'""')+'"';

async function loadTable(f){
  const rows=await api('/api/admin/forms/'+f.id+'/responses');
  const list=[...rows].reverse();
  const cols=[],seen=new Set();
  const short=s=>{s=plain(s).replace(/\s+/g,' ').trim();return s.length>80?s.slice(0,77)+'…':s};
  const add=q=>{if(q.type==='description')return;if(!seen.has(q.id)){seen.add(q.id);cols.push({id:q.id,label:short(q.label),type:q.type})}};
  f.fields.forEach(add);
  list.forEach(r=>r.snapshot.fields.forEach(add));

    }

  const holder=el('div'),progress=el('p',{class:'muted',role:'status'});
  function render(){
    const pc=pageColor(current);form.style.setProperty('--accent',pc.accent);document.documentElement.style.background=pc.tint;
    holder.replaceChildren(...pages[current].nodes);
    stepInfo.textContent=total>1?'Halaman '+(current+1)+' dari '+total:'';
    const prev=btn('Kembali',()=>{e.textContent='';show(current-1)});
    prev.disabled=submitting;
    const isLast=current===total-1;
    const next=el('button',{type:'submit',class:'primary'},isLast?(submitting?'Mengirim…':'Kirim jawaban'):'Lanjut');
    next.disabled=submitting;
    nav.replaceChildren(...(current>0?[prev]:[]),next);
  }
  function show(p){current=p;render();window.scrollTo(0,0)}
  const form=el('form',{noValidate:true,onsubmit:ev=>{
    ev.preventDefault();e.textContent='';
    const msg=checkPage(current);
    if(msg){e.textContent=msg;return}
    if(current<total-1)show(current+1);else submit();
  }},stepInfo,holder,progress,e,nav);
  setPage(form);
  render();
}
async function responses(f){
  try{
    const rows=await api('/api/admin/forms/'+f.id+'/responses');
    setPage(el('div',{class:'bar'},el('div',{},el('h1',{},'Jawaban responden'),el('p',{},(f.adminTitle||f.title)+' · '+rows.length+' respons')),btn('Kembali',dashboard)),
      actions(btn('Unduh Excel (.xlsx)',()=>downloadXlsx(f),'primary'),btn('Unduh CSV',()=>downloadCsv(f))),el('div',{class:'spacer'}),
      ...(rows.length?rows.map((r,i)=>{
        const first=r.snapshot.fields.find(q=>q.type!=='description');
        return card(el('div',{class:'bar'},el('h3',{},'Respons '+(rows.length-i)),el('span',{class:'muted'},formatDate(r.created))),
          r.name?el('p',{},'Nama: '+r.name):null,
          r.position?el('p',{},'Jabatan/Divisi: '+r.position):null,
          first?el('p',{},plain(first.label)+': '+ansText(first,r.answers[first.id])):null,
          fileCount(r)?el('p',{class:'muted'},fileCount(r)+' lampiran'):null,
          btn('Lihat detail & tanda tangan',()=>detail(f,r)));
      }):[card(el('p',{},'Belum ada jawaban. Bagikan link formulir untuk mulai.'))]));
  }catch(e){setPage(card(el('p',{class:'error'},e.message),btn('Kembali',dashboard)))}
}
function display(v){return Array.isArray(v)?v.join(', ')||'—':v||'—'}
const imgList=v=>Array.isArray(v)?v:(v?[v]:[]);
const ansText=(q,v)=>q.type==='image'?(imgList(v).length?imgList(v).length+' gambar terlampir':'—'):display(v);
const fileCount=r=>Object.values(r.attachments||{}).reduce((n,x)=>n+x.length,0);
function answerFiles(list){
  if(!list.length)return null;
  const url=x=>'/api/admin/attachment/'+x.id;
  const images=list.filter(x=>x.mime.startsWith('image/')),others=list.filter(x=>!x.mime.startsWith('image/'));
  return el('div',{},el('small',{},'Lampiran ('+list.length+')'),
    images.length?el('div',{class:'answer-imgs'},images.map(x=>el('a',{href:url(x),target:'_blank',rel:'noopener',title:x.name},el('img',{class:'q-img',src:url(x),alt:x.name})))):null,
    others.length?el('div',{class:'file-links'},others.map(x=>el('a',{href:url(x),download:x.name},x.name+' ('+fileSize(x.size)+')'))):null);
}
function detail(f,r){
  const fields=r.snapshot.fields,total=pageCountOf(fields);
  const sigs=Array.isArray(r.signatures)&&r.signatures.length?r.signatures:[r.signature];
  const blocks=[];
  for(let p=0;p<total;p++){
    if(total>1)blocks.push(el('h2',{class:'page-title',style:'color:'+pageColor(p).accent},'Halaman '+(p+1)));
    if(p===0&&r.name)blocks.push(el('div',{class:'answer'},el('strong',{},'Nama'),el('p',{},r.name)));
    if(p===0&&r.position)blocks.push(el('div',{class:'answer'},el('strong',{},'Jabatan/Divisi'),el('p',{},r.position)));
    fields.filter(q=>pageOf(q)===p&&q.type!=='description').forEach(q=>blocks.push(el('div',{class:'answer'},el('strong',{},plain(q.label)),q.type==='image'&&imgList(r.answers[q.id]).length?el('div',{class:'answer-imgs'},imgList(r.answers[q.id]).map((id,k)=>el('a',{href:'/api/admin/image/'+id,target:'_blank',rel:'noopener'},el('img',{class:'q-img',src:'/api/admin/image/'+id,alt:'Gambar jawaban '+(k+1)})))):el('p',{},display(q.type==='image'?'':r.answers[q.id])),answerFiles(fileList(r,q.id)))));
    blocks.push(el('h3',{},'Tanda tangan'));
    if(sigs[p])blocks.push(el('img',{class:'signature-image',src:sigs[p],alt:'Tanda tangan responden halaman '+(p+1)}));
  }
  setPage(el('div',{class:'bar no-print'},btn('Kembali',()=>responses(f)),btn('Cetak / Simpan PDF',()=>window.print(),'primary')),
    card(el('h1',{},r.snapshot.title),el('p',{class:'muted'},'ID: '+r.id+' · '+formatDate(r.created)),...blocks));
}

async function route(){try{const m=location.hash.match(/^#\/f\/([a-f0-9]{24})$/);if(m){await respondent(m[1]);return}const s=await api('/api/session');if(s.admin)await dashboard();else await showLogin()}catch(e){setPage(card(el('h1',{},'Tidak dapat membuka halaman'),el('p',{class:'error'},e.message),btn('Muat ulang',()=>location.reload())))}}
addEventListener('hashchange',route);route();

</script></body></html>
